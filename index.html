<title>Blast Bros</title>
<meta name="description" content="Twin-stick bro shooter: blast aliens, earn gold stars, refine ore, buy absurd guns.">
<meta name="theme-color" content="#0e1116">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Blast Bros — one deliberate dark look: gunmetal, diamond plate, navy panels with cyan glow. No light theme. */
:root {
  color-scheme: dark;
  --ink: #04080e; --navy: #08131f; --metal: #0c1a2a; --metal2: #12263c; --edge: #2c6a9e; --edge2: #1a3a58;
  --cyan: #5cc8ff; --ice: #c4ecff; --steel: #8fa9bf; --text: #eaf5ff;
  --hazard: #ffb000; --orange: #ff7a1f; --gold: #ffd23f; --cash: #5fd43c; --red: #ff3b45;
  --plate: none; --hex: none;
  --display: 'Black Ops One', 'Impact', 'Arial Black', sans-serif;
  --body: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
}
html, body { height: 100%; background: var(--ink); overflow: hidden; }
body { margin: 0; color: var(--text); font-family: var(--body); font-size: 17px; -webkit-tap-highlight-color: transparent; }
.bb { position: fixed; inset: 0; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; background: var(--ink); }
.bb-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }

/* ---------- thumb pads ---------- */
.bb-sticks { position: absolute; inset: 0; pointer-events: none; }
.pad { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; opacity: .7; transition: opacity .15s; }
.pad.move { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 78px); top: calc(100% - max(16px, env(safe-area-inset-bottom, 0px)) - 78px); }
.pad.aim { left: calc(100% - max(16px, env(safe-area-inset-right, 0px)) - 78px); top: calc(100% - max(16px, env(safe-area-inset-bottom, 0px)) - 78px); }
.pad.on { opacity: 1; }
.pad svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pad .ring { fill: rgba(40,90,150,0.22); stroke: rgba(150,210,255,0.55); stroke-width: 2.5; }
.pad .inner { fill: none; stroke: rgba(150,210,255,0.35); stroke-width: 2; }
.pad .arrow { fill: rgba(170,220,255,0.5); }
.pad i { position: absolute; left: 41px; top: 41px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(220,240,255,0.9), rgba(90,150,210,0.75) 55%, rgba(30,60,100,0.85)); box-shadow: 0 0 0 3px rgba(20,40,70,0.6), 0 0 14px rgba(92,200,255,0.5); }

/* ---------- HUD ---------- */
.hud { position: absolute; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.pause-btn { pointer-events: auto; position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: max(12px, env(safe-area-inset-left, 0px)); width: 40px; height: 40px; display: flex; gap: 5px; justify-content: center; align-items: center; border: 2px solid #3a0c10; border-radius: 6px; background: linear-gradient(#e0343e, #8a1018); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #000; cursor: pointer; }
.pause-btn i { width: 6px; height: 16px; background: #fff; border-radius: 1px; box-shadow: 0 1px 0 rgba(0,0,0,.4); }
.wave-box { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px); left: 50%; transform: translateX(-50%); text-align: center; }
.wave-label { font-family: var(--display); font-size: 17px; letter-spacing: .06em; color: var(--ice); text-shadow: 0 2px 0 #000, 0 0 8px rgba(92,200,255,.5); }
.stats { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 8px); right: max(12px, env(safe-area-inset-right, 0px)); text-align: right; font-weight: 700; font-size: 13px; line-height: 1.15; letter-spacing: .08em; color: var(--ice); text-shadow: 0 1px 0 #000, 0 0 6px rgba(0,0,0,.9); }
.boss { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 50%; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; }
.boss span { font-family: var(--display); font-size: 14px; color: var(--red); text-shadow: 0 1px 2px #000; letter-spacing: .05em; }
.bossbar { height: 10px; margin-top: 3px; background: rgba(0,0,0,0.7); border: 2px solid #5a1a22; border-radius: 3px; overflow: hidden; }
.bossbar i { display: block; height: 100%; background: linear-gradient(#ff5a50, #b0101c); transition: width .1s; }
.rage { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 58px); left: 12px; font-family: var(--display); color: var(--orange); font-size: 14px; animation: pulse .4s infinite alternate; }
.announce { position: absolute; left: 0; right: 0; top: 28%; text-align: center; opacity: 0; transform: scale(.8); transition: opacity .2s, transform .2s; }
.announce.on { opacity: 1; transform: scale(1); }
.announce b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 7vw, 56px); letter-spacing: .03em; color: var(--ice); text-shadow: 0 3px 0 #000, 0 0 18px rgba(92,200,255,.55); }
.announce small { display: block; font-size: 18px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #d8e6f2; text-shadow: 0 1px 2px #000; }
.announce.gold b { color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 18px rgba(255,190,40,.6); }
.announce.red b, .announce.boss b { color: var(--red); text-shadow: 0 3px 0 #000, 0 0 18px rgba(255,40,40,.5); }
.announce.title b { color: var(--hazard); text-shadow: 0 3px 0 #000, 0 0 18px rgba(255,150,0,.5); }
.hint { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); background: rgba(4,10,18,0.8); border: 1px solid var(--edge); padding: 8px 14px; border-radius: 6px; font-weight: 600; white-space: nowrap; font-size: 15px; }

/* Bottom console: diamond-plate bezel with the bars and swap button */
.console { position: absolute; left: 50%; bottom: max(8px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px 8px; width: min(430px, calc(100vw - 340px)); min-width: 290px; border-radius: 12px 12px 8px 8px; background: var(--plate); background-size: 22px; border: 2px solid #15191e; box-shadow: inset 0 2px 0 rgba(255,255,255,0.18), inset 0 -3px 0 rgba(0,0,0,0.4), 0 4px 12px rgba(0,0,0,0.6); }
.c-ore { display: flex; align-items: center; gap: 5px; padding: 4px 8px; background: rgba(0,0,0,0.6); border-radius: 5px; border: 1px solid #000; font-weight: 700; font-size: 16px; color: #ffd27a; min-width: 58px; }
.ore-ico { display: inline-block; width: 10px; height: 14px; background: linear-gradient(135deg, #fff0b0, #ffb31a 45%, #b86a00); clip-path: polygon(50% 0, 100% 40%, 70% 100%, 20% 90%, 0 35%); }
.c-bars { flex: 1; display: grid; gap: 4px; min-width: 0; }
.cbar { display: flex; align-items: center; gap: 5px; }
.cbar .lbl { width: 26px; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #ff5a64; text-shadow: 0 1px 0 #000; }
.cbar.bro .lbl { color: var(--cyan); }
.track { position: relative; flex: 1; height: 13px; background: #050709; border: 1px solid #000; border-radius: 3px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.8); }
.cbar.bro .track { height: 7px; }
.track i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#9dff7a, #3fb82a 55%, #1f7a14); transition: width .15s; }
.track i.low { background: linear-gradient(#ff9a9a, #e0303a 55%, #8a1018); }
.cbar.bro .track i { background: linear-gradient(#a8dcff, #3a8fd6); }
.track em { position: absolute; inset: 0; font-style: normal; font-size: 10px; font-weight: 700; line-height: 13px; text-align: center; text-shadow: 0 1px 1px #000; }
.swap { pointer-events: auto; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; max-width: 150px; border: 2px solid #0a2238; border-radius: 7px; background: linear-gradient(#3aa8f0, #1560a8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 0 #000; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); cursor: pointer; touch-action: none; text-align: left; line-height: 1.05; }
.swap svg { width: 22px; height: 22px; flex: none; fill: #fff; filter: drop-shadow(0 1px 0 rgba(0,0,0,.5)); }
.swap.solo { background: linear-gradient(#4a5563, #262e38); cursor: default; }
.swap.solo svg { opacity: .35; }

/* ---------- stars ---------- */
.stars { display: inline-flex; gap: 4px; justify-content: center; }
.star { display: inline-block; width: 18px; height: 18px; background: rgba(255,255,255,0.16); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); vertical-align: -3px; }
.star.silver { background: linear-gradient(135deg, #f2f5f8, #8d9aa6); }
.star.gold { background: linear-gradient(135deg, #fff3a0, #ffc21a 55%, #d48a00); }
.star.gold.live { animation: glint 1s infinite alternate; }
.star.dim { background: rgba(255,59,69,0.5); }
.stars.big .star { width: 40px; height: 40px; }
@keyframes glint { to { filter: brightness(1.4) drop-shadow(0 0 4px #ffd23f); } }
@keyframes pulse { to { opacity: .5; } }

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; padding: max(10px, env(safe-area-inset-top, 0px)) 16px calc(env(safe-area-inset-bottom, 0px) + 24px); background: radial-gradient(ellipse at 50% 30%, rgba(4,10,18,0.5), rgba(4,8,14,0.9)); touch-action: pan-y; }
.screen.pause, .screen.down { background: rgba(4,8,14,0.72); display: grid; place-items: center; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 980px; margin: 0 auto 10px; padding: 6px 8px; border-radius: 8px; background: var(--plate); background-size: 22px; border: 2px solid #111418; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 3px 10px rgba(0,0,0,.5); }
.wallet { display: flex; gap: 10px; font-size: 18px; font-weight: 700; }
.wallet .cur { background: rgba(0,0,0,0.65); padding: 3px 12px 3px 6px; border-radius: 14px; border: 1px solid #000; box-shadow: inset 0 1px 3px rgba(0,0,0,.8); }
.cur { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cur i { display: inline-grid; place-items: center; font-style: normal; }
.cur.coin i { width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b0, var(--gold) 45%, #9a6b00); box-shadow: inset 0 0 0 1.5px #7a5200, 0 1px 0 #000; }
.cur.bux i { padding: 0 4px; height: 15px; border-radius: 2px; background: linear-gradient(#8ae86a, #3a9a26); color: #0a2a06; font-size: 10px; font-weight: 700; box-shadow: 0 1px 0 #000; }
.icon-btn { pointer-events: auto; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 7px; border: 2px solid #0a2238; background: linear-gradient(#2e7fc0, #154a7a); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 2px 0 #000; cursor: pointer; }
.panel { position: relative; max-width: 640px; margin: 0 auto; background: var(--hex), linear-gradient(180deg, #0e2034, #081421); border: 2px solid var(--edge); border-radius: 10px; padding: 18px; box-shadow: 0 0 0 2px #03070c, 0 0 22px rgba(92,200,255,0.18), inset 0 0 30px rgba(0,0,0,0.5); }
.panel.wide { max-width: 980px; }
.panel.narrow { max-width: 380px; width: 100%; }
.panel.center { text-align: center; }
h2 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0 0 6px; letter-spacing: .03em; color: var(--ice); text-shadow: 0 2px 0 #000, 0 0 10px rgba(92,200,255,.4); text-wrap: balance; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--hazard); }
.muted { color: var(--steel); line-height: 1.35; max-width: 60ch; margin: 6px auto 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 14px; }
.menu { display: grid; gap: 10px; margin: 18px auto 0; width: min(340px, 100%); }

.btn { position: relative; border: 2px solid #050b12; border-radius: 7px; padding: 10px 18px; font-size: 18px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: linear-gradient(#2a4560, #152a40); color: var(--text); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 3px 0 #000; text-shadow: 0 1px 0 rgba(0,0,0,.6); cursor: pointer; transition: transform .06s, filter .15s; }
.btn:hover:not(:disabled) { filter: brightness(1.18); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 1px 0 #000; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: saturate(.3); }
.btn.big { font-family: var(--display); font-weight: 400; font-size: 22px; padding: 12px 22px; background: linear-gradient(#8be04f, #3f9e1c 55%, #2a7410); color: #fff; border-color: #0e2a06; }
.btn.alt { background: linear-gradient(#3aa8f0, #1560a8); border-color: #0a2238; }
.btn.big.alt { color: #fff; }
.btn.ghost { background: linear-gradient(#1a2a3a, #0e1a26); box-shadow: inset 0 0 0 1px var(--edge2), 0 3px 0 #000; }
.btn.small { font-size: 14px; padding: 6px 11px; }
.btn.on { background: linear-gradient(#ffd24a, #d49000); color: #1a1000; text-shadow: none; border-color: #3a2600; }
.btn small { display: block; font-family: var(--body); font-size: 13px; letter-spacing: .04em; text-transform: none; font-weight: 600; opacity: .9; margin-top: 2px; }
.btn.sponsor { background: linear-gradient(#e0343e, #8a1018); border-color: #3a0c10; }
.btn.buy { background: linear-gradient(#8be04f, #3f9e1c 55%, #2a7410); border-color: #0e2a06; }

/* Title */
.title-wrap { max-width: 520px; margin: 0 auto; text-align: center; padding-top: 2vh; }
.logo { display: inline-grid; line-height: .85; transform: rotate(-3deg); margin: 8px 0 4px; filter: drop-shadow(0 4px 0 #000) drop-shadow(0 0 18px rgba(0,0,0,.8)); }
.logo span { font-family: var(--display); font-size: clamp(64px, 17vw, 112px); letter-spacing: .02em; -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo .l1 { background-image: linear-gradient(#fff6c8 0%, #ffc53a 42%, #a85a00 50%, #ffb000 72%, #ffe28a 100%); }
.logo .l2 { background-image: linear-gradient(#ffffff 0%, #c9d6e2 42%, #3e5266 50%, #a9c0d4 75%, #eef6ff 100%); margin-left: .5em; }
.tag { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); font-size: 14px; margin: 10px 0 0; text-shadow: 0 1px 0 #000, 0 0 8px rgba(92,200,255,.4); }
.controls-note { color: var(--steel); font-size: 14px; margin-top: 16px; text-shadow: 0 1px 0 #000; }
.ref-chip { margin: 14px auto 0; padding: 9px 14px; border-radius: 8px; background: rgba(4,12,22,0.85); border: 1px solid var(--edge); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; font-variant-numeric: tabular-nums; }
button.ref-chip.ready { cursor: pointer; border-color: var(--gold); box-shadow: 0 0 14px rgba(255,210,63,.4); animation: pulse .6s infinite alternate; font-size: 16px; }

/* Campaign */
.ptabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
.ptab { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 7px; border: 2px solid var(--edge2); background: linear-gradient(#142a42, #0a1828); font-size: 16px; font-weight: 700; cursor: pointer; }
.ptab.on { border-color: var(--cyan); box-shadow: 0 0 10px rgba(92,200,255,.45); }
.ptab.locked { opacity: .5; }
.orb { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset -3px -3px 6px rgba(0,0,0,.6); }
.planet-head { border-left: 4px solid var(--glow); padding-left: 12px; margin-bottom: 10px; }
.planet-head p { margin: 0; color: var(--steel); }
.rev { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--hazard); margin: 6px 0 10px; }
.missions { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.mission { display: grid; gap: 4px; text-align: left; padding: 12px; border-radius: 8px; border: 2px solid var(--edge2); background: var(--hex), linear-gradient(#10243a, #0a1624); cursor: pointer; }
.mission:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 12px rgba(92,200,255,.35); }
.mission.locked { opacity: .4; cursor: not-allowed; }
.mission.bossm { border-color: #6a1a22; background: var(--hex), linear-gradient(#2a1018, #120a10); }
.mnum { font-family: var(--display); color: var(--cyan); font-size: 15px; }
.mission.bossm .mnum { color: var(--red); }
.mname { font-size: 18px; font-weight: 700; }
.mission .stars { justify-content: flex-start; }
.mission .star { width: 16px; height: 16px; }
.legend { color: var(--steel); font-size: 14px; margin: 12px 0 0; }
.legend .star { width: 14px; height: 14px; }
.locked-msg { color: var(--steel); font-size: 18px; padding: 20px 0; }

/* Loadout + armory */
.loadout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.slot { display: grid; padding: 8px 10px; border-radius: 7px; background: rgba(0,0,0,0.45); border: 1px solid var(--edge2); min-width: 0; text-align: left; }
.slot b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot.empty b { color: var(--steel); }
.slabel { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); font-weight: 700; }
.lv { font-size: 12px; color: var(--hazard); font-weight: 700; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tab { flex: 1; padding: 8px; border-radius: 7px; border: 2px solid var(--edge2); background: linear-gradient(#142a42, #0a1828); font-family: var(--display); font-size: 18px; cursor: pointer; color: var(--steel); }
.tab.on { border-color: var(--cyan); color: #fff; background: linear-gradient(#2a6aa0, #154070); box-shadow: 0 0 10px rgba(92,200,255,.4); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 6px; background: var(--hex), linear-gradient(#0e2034, #08131f); border: 2px solid #1f4f7a; box-shadow: inset 0 0 20px rgba(0,0,0,.5); }
.card.owned { border-color: var(--cyan); }
.card.premium { border-color: #2f8a3a; }
.card.ultimate { border-image: linear-gradient(90deg, #ff5d5d, #ffd23f, #5dff9b, #5db8ff, #c77dff) 1; }
.chead { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.cname { font-size: 20px; display: flex; align-items: center; gap: 6px; color: var(--ice); }
.cls { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--steel); border: 1px solid var(--edge2); border-radius: 3px; padding: 1px 5px; vertical-align: 3px; }
.card.premium .cls { color: var(--cash); border-color: #2f6d3a; }
.lvpip { font-family: var(--display); color: var(--hazard); font-size: 14px; white-space: nowrap; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 3px solid; flex: none; }
.blurb { margin: 0; color: var(--steel); font-size: 15px; line-height: 1.3; flex: 1; }
.stat { display: grid; grid-template-columns: 58px 1fr 52px; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--steel); }
.stat b { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.sbar { height: 7px; border-radius: 2px; background: #03070c; border: 1px solid #000; overflow: hidden; }
.sbar i { display: block; height: 100%; background: linear-gradient(#8fe0ff, #2a8ad6); }
.sbar.over i { background: linear-gradient(90deg, #ff5d5d, #ffd23f, #5dff9b, #5db8ff, #c77dff); animation: glint .5s infinite alternate; }
.notes { margin: 0; font-size: 13px; font-weight: 600; color: var(--hazard); }
.cact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 4px; }
.equip { display: flex; gap: 6px; }
.maxed { font-family: var(--display); color: var(--gold); font-size: 14px; }

/* Results */
.big-word { font-family: var(--display); font-size: clamp(34px, 9vw, 54px); color: var(--ice); text-shadow: 0 3px 0 #000, 0 0 16px rgba(92,200,255,.5); transform: rotate(-2deg); margin: 4px 0 8px; }
.big-word.gold { color: var(--gold); text-shadow: 0 3px 0 #000, 0 0 16px rgba(255,190,40,.6); }
.big-word.red { color: var(--red); text-shadow: 0 3px 0 #000, 0 0 16px rgba(255,40,40,.5); }
.kv { display: grid; grid-template-columns: auto auto; gap: 4px 18px; justify-content: center; margin: 14px 0 6px; font-size: 17px; }
.kv span { color: var(--steel); text-align: right; }
.kv b { text-align: left; font-variant-numeric: tabular-nums; }
.note { margin: 4px 0; font-weight: 700; color: var(--cash); }
.refine { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--edge2); }
.refine-math { font-size: 17px; font-weight: 600; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.banked { color: var(--steel); margin-top: 14px; }

/* Sponsor ad */

/* ================= v3: nav, space map, store, refinery, ops, new HUD ================= */
/* Top nav strip (diamond plate) */

/* Space map */

/* HUD additions */

    function gunCard(id) {

    function armorCard(id, slot) {

      const locked = !owned && level() < d.lvl, cost = piecePrice(id, slot), wearing = save.loadout.armor[slot] === id;
      const L = (lvl || 1) - 1, U = C.armorUpgrade, prem = d.cur === 'bux', hpL = prem ? U.premiumHpPerLvl : U.hpPerLvl, stL = prem ? U.premiumStatPerLvl : U.statPerLvl;
      const statsAt = (L) => [['HP', Math.round(d.hp * share + (C.player.hp + d.hp) * share * hpL * L), (v) => '+' + v], ['DEF', d.def * share * (1 + stL * L), pct], ['ATK', d.atk * share * (1 + stL * L), pct], ['SPD', d.spd * share * (1 + stL * L), pct]];
      const cur = statsAt(L), nxt = statsAt(L + 1);
      const stats = cur
        .filter((s) => Math.abs(s[1]) > 0.0001).map((s) => `<span class="${s[1] < 0 ? 'neg' : 'pos'}">${s[0]} ${s[2](s[1])}</span>`).join('');
      let actions, upInfo = '';
      if (!owned) {
        const can = !locked && (d.cur === 'bux' ? save.bux >= cost : save.coins >= cost);
        actions = `<button class="btn buy" data-act="buy" data-kind="piece" data-id="${id}" data-slot="${slot}" ${can ? '' : 'disabled'}>Buy ${price(d, cost)}</button>`;
      } else {
        const max = lvl >= BB.maxLvl(C, d, true), ucost = BB.upgradeCost(C, id, lvl, true, slot);
        const diffs = cur.map((c, i) => [c, nxt[i]]).filter(([c, n]) => Math.abs(n[1]) > 0.0001 && Math.abs(n[1] - c[1]) > 0.0001).map(([c, n]) => `${c[0]} ${c[2](c[1])} → <em>${n[2](n[1])}</em>`);
        upInfo = max ? `<p class="upinfo max">Fully upgraded.</p>` : `<p class="upinfo"><b>Next level:</b> ${diffs.join(' · ') || 'no stat change'}<small>Each upgrade: +${Math.round(hpL * 100)}% max health${stats.includes('DEF') || stats.includes('ATK') || stats.includes('SPD') ? ` · +${Math.round(stL * 100)}% to its other stats` : ''}</small></p>`;
        actions = `${max ? '<span class="maxed">MAX LEVEL</span>' : `<button class="btn small" data-act="upgrade" data-kind="piece" data-id="${id}" data-slot="${slot}" ${save.coins >= ucost ? '' : 'disabled'}>Upgrade → LV ${lvl + 1} ${coin(ucost)}</button>`}
          <button class="btn small ${wearing ? 'on' : 'ghost'}" data-act="wear" data-id="${id}" data-slot="${slot}">${wearing ? 'Wearing' : 'Wear'}</button>`;
      }
      return `<div class="card ${owned ? 'owned' : ''} ${d.cur === 'bux' ? 'premium' : ''} ${locked ? 'is-locked' : ''}">
        <div class="chead"><div><b class="cname"><i class="swatch" style="background:${d.color};border-color:${d.trim}"></i>${d.pieces[C.slots.indexOf(slot)]}</b><span class="cls">${slot}</span></div>${owned ? `<span class="lvpip">LV ${lvl}/${BB.maxLvl(C, d, true)}</span>` : d.cur === 'bux' ? '<span class="ceil">LV 20 cap</span>' : ''}</div>
        <p class="blurb">${d.name} set. ${d.blurb}</p>
        <p class="pstat">${stats || '<span>No stats. Pure style.</span>'}</p>${upInfo}
        <div class="cact">${actions}</div>${locked ? lockBadge(d.lvl) : ''}</div>`;
    }

    // ---------- runs ----------
    function newSeed() { return params.has('seed') ? +params.get('seed') : (Math.random() * 1e9) | 0; }
    function startRun(opts) {
      G.opts = opts;

      input.mouse.down = false;
      G.run = BB.newRun(C, Object.assign({ seed: newSeed() }, loadoutOpts(), DEV ? { god: G.dev.god, oneHit: G.dev.oneHit } : {}, opts));

      announce(opts.mode === 'lab' ? `<b>ENEMY LAB</b><small>${C.enemies[opts.lab.spawns[0]].name} ×${opts.lab.spawns.length} · tier ${opts.lab.tier}</small>` : opts.mode === 'endless' ? '<b>ENDLESS</b><small>How long can a bro last?</small>' : `<b>${P.name.toUpperCase()}</b><small>${G.run.mission === C.missionsPerPlanet - 1 ? 'Boss sector' : 'Sector ' + (G.run.mission + 1)} · Revolution ${roman(G.run.rev)}</small>`, 'title', 1500);

        h.innerHTML = '<b>Rivers &amp; chasms:</b> shoot across them, walk over at the bridges.';
        setTimeout(() => { h.hidden = true; h.classList.remove('wide'); }, 9000);
        save.tips.cover = true; persist();
      }
      if (!save.tips.controls) {
        const h = $('hint'); h.hidden = false;
        h.textContent = touchUI ? 'Left thumb: move · Right thumb: aim and shoot' : 'WASD move · Mouse aim · Hold click shoot · Q swap · 1 heal · 2 grenade';
        setTimeout(() => { h.hidden = true; }, 7000);

    }
    function buildSwap() {
      const p = G.run.p, b = $('swap-btn');
      b.classList.toggle('solo', p.weapons.length < 2);
      $('swap-name').textContent = C.weapons[p.weapons[p.cur].id].name;
    }

    function finishRun() {
      const run = G.run, won = run.over === 'win';
      if (run.mode === 'lab') { // dev lab: nothing is banked or saved
        G.result = { mode: 'lab', won, ore: run.ore, mul: 1, banked: 0, perfect: 0, waves: run.waveLog.slice(-5), bux: 0, notes: ['Enemy lab: nothing is saved'], kills: run.kills, streak: run.bestStreak, xp: 0 };
        audio.music(false); show('results'); return;
      }
      const mul = BB.refineMul(C, run), perfect = run.waveLog.filter(Boolean).length;
      const banked = Math.round(run.ore * mul);
      const clearXp = won ? Math.round(C.xp.clearBase + run.tier * C.xp.clearPerTier) : 0;
      const lvBefore = level();
      const res = { mode: run.mode, won, ore: run.ore, mul, banked, perfect, waves: run.waveLog.slice(), bux: 0, notes: [], kills: run.kills, streak: run.bestStreak, xp: run.xp + clearXp };
      save.ore += banked;
      save.xp += res.xp;
      for (const k of ['medkit', 'grenade']) save.items[k] = Math.max(0, save.items[k] - run.used[k]);
      for (const [id, n] of Object.entries(run.gunKills)) {
        const before = BB.masteryRank(C, save.gunKills[id]); save.gunKills[id] = (save.gunKills[id] || 0) + n;
        const after = BB.masteryRank(C, save.gunKills[id]);
        if (after > before) res.notes.push(`${C.weapons[id].name}: ${['', 'Bronze', 'Silver', 'Gold'][after]} mastery (+${BB.MASTERY[after] * 100}% damage)`);
      }
      const lvAfter = level();
      if (lvAfter > lvBefore) { const g2 = (lvAfter - lvBefore) * C.rewards.levelBux; res.bux += g2; res.notes.push(`Level up! Now level ${lvAfter}: +${g2} Bro Bucks`); }
      if (run.mode === 'endless') {
        const reached = run.wave; res.reached = reached;
        const old = save.endlessBest;
        if (reached > old) {
          const E = C.endless.buxEvery;
          const gain = (Math.floor(reached / E) - Math.floor(old / E)) * C.rewards.endlessBux;
          if (gain > 0) { res.bux += gain; res.notes.push(`New milestone: +${gain} Bro Bucks`); }
          save.endlessBest = reached; res.record = true;
        }
      } else if (won) {
        const pd = save.planets[run.planet], m = run.mission;
        if (!pd.done[m]) { pd.done[m] = true; res.bux += C.rewards.firstClearBux; res.notes.push(`First clear: +${C.rewards.firstClearBux} Bro Bucks`); }
        if (perfect === C.wavesPerMission && pd.stars[m] < C.wavesPerMission) { res.bux += C.rewards.allPerfectBux; res.notes.push(`All five gold stars: +${C.rewards.allPerfectBux} Bro Bucks`); }
        pd.stars[m] = Math.max(pd.stars[m], perfect);
        pd.cleared = Math.max(pd.cleared, m + 1);
        if (m === C.missionsPerPlanet - 1) {
          const gain = pd.everCleared ? Math.ceil(C.rewards.planetBux / 2) : C.rewards.planetBux;
          res.bux += gain;
          res.notes.push(`${C.planets[run.planet].name} liberated: +${gain} Bro Bucks`);
          if (!pd.everCleared && run.planet + 1 < C.planets.length) res.notes.push(`${C.planets[run.planet + 1].name} unlocked`);
          pd.everCleared = true; pd.rev++; pd.cleared = 0;
          pd.stars = Array(C.missionsPerPlanet).fill(0); pd.done = Array(C.missionsPerPlanet).fill(false);
          res.notes.push(`Revolution ${roman(pd.rev)} begins: tougher aliens, richer ore`);
          res.planetDone = true;
        }
      }
      // Bro-Ops progress
      ensureOps();
      const add = { kills: run.kills, perfect, nade: run.stats.nade || 0, barrel: run.stats.barrel || 0, boss: run.stats.boss || 0, ore: run.ore };
      for (const o of save.ops.list) {
        if (o.id === 'streak') o.prog = Math.max(o.prog, run.bestStreak);
        else if (o.id === 'wave') { if (run.mode === 'endless') o.prog = Math.max(o.prog, run.wave); }
        else o.prog += add[o.id] || 0;
      }
      if (opsReady()) res.notes.push('A Bro-Op is ready to claim');
      save.bux += res.bux;
      persist();
      G.result = res;
      audio.music(false);
      show('results');
    }

          <button class="btn ghost" data-act="nav" data-to="store">Store</button>

    // ---------- actions ----------
    const ACTS = {
      logo() {
        const now = performance.now(); G.logoN = now - (G.logoT || 0) < 1500 ? (G.logoN || 0) + 1 : 1; G.logoT = now;
        if (G.logoN >= 7) { G.logoN = 0; try { localStorage.setItem('blastbros.devmode', DEV ? '0' : '1'); if (DEV) localStorage.removeItem('blastbros.devmode'); } catch (e) {} toast(DEV ? 'Leaving dev mode' : 'Dev mode on: separate save'); setTimeout(() => { location.search = DEV ? '?dev=0' : '?dev=1'; }, 700); }
      },
      dev(el) {
        if (!DEV) return;
        const D = G.dev, what = el.dataset.do;
        const xpFor = (L) => { let xp = 0; for (let k = 1; k < L; k++) xp += k === 1 ? C.xp.base : Math.round(C.xp.base * Math.pow(k, C.xp.pow)); return xp; };
        if (what === 'level') save.xp = xpFor(D.level);
        else if (what === 'coins') save.coins += 1e6;
        else if (what === 'bux') save.bux += 1e4;
        else if (what === 'ore') save.ore += 1000;
        else if (what === 'items') save.items = { medkit: C.carry, grenade: C.carry };
        else if (what === 'guns') for (const [id, d] of Object.entries(C.weapons)) save.guns[id] = Math.min(D.lvl, BB.maxLvl(C, d));
        else if (what === 'armor') for (const [id, d] of Object.entries(C.armors)) for (const slot of C.slots) save.pieces[pieceKey(id, slot)] = Math.min(D.alvl, BB.maxLvl(C, d, true));
        else if (what === 'planets') for (const pd of save.planets) { pd.everCleared = true; pd.rev = D.rev; pd.cleared = C.missionsPerPlanet - 1; }
        else if (what === 'god') D.god = !D.god;
        else if (what === 'onehit') D.oneHit = !D.oneHit;
        else if (what === 'lab') {
          const boss = C.enemies[D.type].boss ? D.type : null;
          return startRun({ mode: 'lab', planet: D.planet, lab: { tier: BB.tierFor(C, D.planet, D.sector - 1, D.rev), theme: D.planet, spawns: Array(D.count).fill(D.type), boss } });
        }
        else if (what === 'reset') { if (!confirm('Wipe the dev save?')) return; Object.keys(save).forEach((k) => delete save[k]); Object.assign(save, BB.freshSave(C)); }
        else if (what === 'exit') { try { localStorage.removeItem('blastbros.devmode'); } catch (e) {} location.search = '?dev=0'; return; }
        persist(); audio.play('buy'); rerender();
      },
      mute() { audio.setMuted(!audio.muted); save.muted = audio.muted; persist(); rerender(); },
      speed() { save.fast = !save.fast; persist(); show('pause'); },
      sound() { G.soundBack = G.screen; show('sound'); },
      'sound-done'() { const b2 = G.soundBack || 'title'; show(b2 === 'pause' ? 'pause' : b2, b2 === 'brief' ? G.briefMission : undefined); },
      nav(el) {
        const to = el.dataset.to;
        if (G.screen === 'results' && to !== 'refinery' && save.ore >= 1) toast(`${fmt(Math.floor(save.ore))} ore waiting in the Refinery`);
        if (to === 'endless') return startRun({ mode: 'endless' });
        if (to === 'store') G.back = el.dataset.back || '';
        show(to);
      },
      planet(el) { G.planet = +el.dataset.i; show('campaign'); },
      brief(el) { show('brief', +el.dataset.m); },
      'back-brief'() { G.back = ''; show('brief', G.briefMission); },
      tab(el) { G.tab = el.dataset.t; show('store'); },
      slot(el) { G.slot = el.dataset.s; rerender(); },
      gclass(el) { G.gclass = el.dataset.c; rerender(); },
      deploy() { startRun({ mode: 'mission', planet: G.planet, mission: G.briefMission, rev: save.planets[G.planet].rev }); },
      buy(el) {
        const kind = el.dataset.kind, id = el.dataset.id, slot = el.dataset.slot;
        const d = kind === 'gun' ? C.weapons[id] : C.armors[id], cost = kind === 'gun' ? d.price : piecePrice(id, slot);
        const purse = d.cur === 'bux' ? 'bux' : 'coins';
        if (save[purse] < cost || level() < d.lvl) { audio.play('nope'); return; }
        save[purse] -= cost;
        if (kind === 'gun') { save.guns[id] = 1; if (!save.loadout.guns[1]) save.loadout.guns[1] = id; toast(`${d.name} acquired`); }
        else { save.pieces[pieceKey(id, slot)] = 1; save.loadout.armor[slot] = id; toast(`${d.pieces[C.slots.indexOf(slot)]} acquired and equipped`); }
        persist(); audio.play('buy'); rerender();
      },
      upgrade(el) {
        const kind = el.dataset.kind, id = el.dataset.id, slot = el.dataset.slot;
        const lvl = kind === 'gun' ? save.guns[id] : save.pieces[pieceKey(id, slot)];
        const cost = BB.upgradeCost(C, id, lvl, kind !== 'gun', slot);
        if (save.coins < cost) { audio.play('nope'); return; }
        save.coins -= cost;
        if (kind === 'gun') save.guns[id] = lvl + 1; else save.pieces[pieceKey(id, slot)] = lvl + 1;
        persist(); audio.play('buy'); rerender();
      },
      equip(el) {
        const s = +el.dataset.slot, id = el.dataset.id, g = save.loadout.guns;
        const other = g.indexOf(id);

        const a = G.attract;
        const n2 = Math.min(6, Math.max(1, Math.ceil(dt / STEP - 0.001)));
        for (let i = 0; i < n2; i++) { BB.step(a, attractBot(a), (dt / n2) * C.pace); R.consume(a, a.events); a.events.length = 0; }
        R.draw(a, dt);
        if (now - countdownT > 1000) {
          countdownT = now;
          for (const el of document.querySelectorAll('[data-countdown]')) {
            const id = el.dataset.countdown;
            if (id === 'ops') { const t = new Date(); t.setHours(24, 0, 0, 0); el.textContent = clock(t - Date.now()); continue; }
            const r = save.refinery[id];
            if (!r || r.readyAt <= Date.now()) { rerender(); break; }
            el.textContent = clock(r.readyAt - Date.now());
          }
        }
      }
      requestAnimationFrame(frame);
    }

    addEventListener('resize', () => { R.resize(); G.hudT = 0; });
    // The main console covers a full-width-ish strip: keep the camera's framing clear of it (bottom in landscape, top in portrait).
    function hudInsets() {
      const el = root.querySelector('.console'), cr = canvas.getBoundingClientRect();
      if (!el || el.closest('[hidden]')) return { t: 0, b: 0 };
      const r = el.getBoundingClientRect(), mid = (r.top + r.bottom) / 2 - cr.top;
      return mid > cr.height / 2 ? { t: 0, b: Math.max(0, cr.bottom - r.top + 6) } : { t: Math.max(0, r.bottom - cr.top + 6), b: 0 };
    }
    // Where HUD panels cover the play canvas, so off-screen enemy arrows can steer clear of them.
    function hudRects() {
      const cr = canvas.getBoundingClientRect(), out = [];
      for (const sel of ['.console', '#med-btn', '#nade-btn', '#pause-btn', '.wave-box', '.hud-tr', '#boss', '#stick-l', '#stick-r']) {
        const el = root.querySelector(sel);
        if (!el || el.closest('[hidden]')) continue;
        const r = el.getBoundingClientRect();
        if (r.width < 2 || r.height < 2) continue;
        out.push({ l: r.left - cr.left, t: r.top - cr.top, r: r.right - cr.left, b: r.bottom - cr.top });
      }
      return out;
    }
    show('title');
    if (pendingToast) setTimeout(() => toast(pendingToast), 600);
    requestAnimationFrame(frame);
    return G;
  };
})(window.BlastBros);

// Blast Bros — boot once fonts are ready so canvas text uses the real faces.
(function (BB) {
  const go = () => BB.start(document.getElementById('bb'));
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]).then(go);
  else go();
})(window.BlastBros);

</script>
